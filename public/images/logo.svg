<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Logo">
  <!-- Logo neutre par défaut (bâtiment + ruban). Chaque établissement téléverse le sien : Paramètres > Établissement -->
  <defs>
    <clipPath id="cercle"><circle cx="120" cy="92" r="72"/></clipPath>
  </defs>

  <!-- Cercle -->
  <circle cx="120" cy="92" r="72" fill="#ffffff" stroke="#096a9b" stroke-width="6"/>

  <!-- Bâtiment (coupé par le cercle en bas) -->
  <g clip-path="url(#cercle)" fill="#096a9b">
    <!-- flèche + tour -->
    <path d="M120 22 L124 44 H116 Z"/>
    <rect x="108" y="44" width="24" height="16"/>
    <rect x="113" y="48" width="14" height="9" fill="#ffffff"/>
    <rect x="104" y="60" width="32" height="90"/>
    <!-- fenêtres verticales de la tour -->
    <rect x="109" y="70" width="4" height="40" rx="2" fill="#ffffff"/>
    <rect x="118" y="70" width="4" height="40" rx="2" fill="#ffffff"/>
    <rect x="127" y="70" width="4" height="40" rx="2" fill="#ffffff"/>
    <!-- ailes -->
    <path d="M60 104 L104 96 V150 H60 Z"/>
    <path d="M180 104 L136 96 V150 H180 Z"/>
    <rect x="68" y="110" width="4" height="22" rx="2" fill="#ffffff"/>
    <rect x="78" y="108" width="4" height="24" rx="2" fill="#ffffff"/>
    <rect x="88" y="106" width="4" height="26" rx="2" fill="#ffffff"/>
    <rect x="148" y="106" width="4" height="26" rx="2" fill="#ffffff"/>
    <rect x="158" y="108" width="4" height="24" rx="2" fill="#ffffff"/>
    <rect x="168" y="110" width="4" height="22" rx="2" fill="#ffffff"/>
  </g>

  <!-- Ruban -->
  <path d="M26 132 H52 V172 H26 L38 152 Z" fill="#075176"/>
  <path d="M214 132 H188 V172 H214 L202 152 Z" fill="#075176"/>
  <path d="M52 172 L60 180 V164 Z" fill="#053b56"/>
  <path d="M188 172 L180 180 V164 Z" fill="#053b56"/>
  <rect x="44" y="126" width="152" height="46" rx="3" fill="#096a9b"/>
  <text x="120" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#ffffff">UNIVERSITÉ</text>
</svg>
